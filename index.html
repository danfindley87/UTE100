<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ute 100 Live Tracker & Pacing Dashboard</title>

  <!-- Mapbox -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="config.js"></script> <!-- API key -->

  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; background: #f4f6f9; transition: background 0.3s, color 0.3s; }
    
    #map { width: 100%; height: 50%; position: relative; transition: height 0.3s ease; }
    #elevationContainer { width: 100%; height: 20%; background: white; border-top: 1px solid #ccc; border-bottom: 1px solid #ccc; transition: background 0.3s, border-color 0.3s; }
    #elevationChart { width: 100%; height: 100%; max-height: 200px; }
    #tableContainer { width: 100%; height: 30%; overflow-y: auto; background: #ffffff; padding: 10px; box-sizing: border-box; transition: background 0.3s; }
    
    #infoPanel { position: absolute; top: 10px; left: 10px; background: rgba(255, 255, 255, 0.95); padding: 10px 14px; border-radius: 8px; font-size: 13px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); z-index: 999; transition: background 0.3s, color 0.3s; }
    #infoPanel .title { font-weight: bold; font-size: 15px; margin-bottom: 6px; color: #1E3F66; transition: color 0.3s; }
    #lastUpdate, #averagePace, #estFinish, #climbInfo, #deltaTarget { font-size: 12px; margin-top: 3px; color: #333; transition: color 0.3s; }
    
    #radarControls { position: absolute; bottom: 10px; right: 10px; background: rgba(255, 255, 255, 0.95); padding: 8px 12px; border-radius: 8px; font-size: 12px; z-index: 999; width: 190px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: background 0.3s, color 0.3s; }
    #radarControls button { margin-top: 4px; display: block; width: 100%; padding: 4px; border-radius: 4px; border: 1px solid #ccc; background: #f8f9fa; cursor: pointer; font-size: 11px; transition: background 0.3s, color 0.3s, border-color 0.3s; }
    #radarControls button:hover { background: #e2e6ea; }

    /* Aid Station Table Styling */
    table.pacingTable { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; transition: color 0.3s; }
    table.pacingTable th { background-color: #1E3F66; color: white; padding: 8px; position: sticky; top: 0; z-index: 10; transition: background 0.3s, color 0.3s; }
    table.pacingTable td { padding: 8px; border-bottom: 1px solid #e0e0e0; transition: border-color 0.3s; }
    table.pacingTable tr:nth-child(even) { background-color: #f9fafb; transition: background 0.3s; }
    
    .status-passed { color: #888; text-decoration: line-through; background-color: #f0f0f0 !important; }
    .status-next { color: #c62828; font-weight: bold; background-color: #ffebee !important; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; color: white; display: inline-block; }
    .badge-crew { background-color: #0288d1; }
    .badge-drop { background-color: #ed6c02; }
    .badge-gear { background-color: #7b1fa2; }

    /* --- DARK MODE UI STYLES --- */
    body.dark-mode { background: #121212; color: #eee; }
    body.dark-mode #infoPanel, body.dark-mode #radarControls { background: rgba(30, 30, 30, 0.85); color: #eee; }
    body.dark-mode #infoPanel .title { color: #82b1ff; }
    body.dark-mode #lastUpdate, body.dark-mode #averagePace, body.dark-mode #climbInfo { color: #ccc; }
    body.dark-mode #estFinish { color: #4caf50; }
    body.dark-mode #deltaTarget { color: #ff5252; }
    body.dark-mode #elevationContainer { background: #1e1e1e; border-color: #333; }
    body.dark-mode #tableContainer { background: #1e1e1e; }
    body.dark-mode table.pacingTable th { background-color: #222; color: #82b1ff; }
    body.dark-mode table.pacingTable td { border-bottom: 1px solid #333; }
    body.dark-mode table.pacingTable tr:nth-child(even) { background-color: #2a2a2a; }
    body.dark-mode .status-passed { color: #666; background-color: #1a1a1a !important; }
    body.dark-mode .status-next { color: #ff8a80; background-color: #4a1c1c !important; }
    body.dark-mode #radarControls button { background: #333; color: #eee; border-color: #555; }
    body.dark-mode #radarControls button:hover { background: #444; }
  </style>
</head>
<body>
  <div id="map">
    <div id="infoPanel">
      <div class="title">Ute 100 Tracker</div>
      Mile: <span id="mile">0.0</span> | Elev: <span id="elev">0</span> ft | Left: <span id="remain">0</span> mi
      <div id="climbInfo">Climbed: 0 ft | To Go: 0 ft</div>
      <div id="lastUpdate">Location: Waiting for InReach...</div>
      <div id="averagePace" style="font-weight: bold;">Overall Pace: --</div>
      <div id="estFinish" style="font-weight: bold; color: #2e7d32;">Est Finish: --</div>
      <div id="deltaTarget" style="font-weight: bold; color: #B22222;">Vs 30-Hr Plan: --</div>
    </div>

    <div id="radarControls">
      <input type="checkbox" id="toggleRadar" checked> Weather Radar 🌧<br>
      <label for="radarStrength" style="font-size:11px;">Radar Opacity:</label>
      <input type="range" id="radarStrength" min="1" max="20" value="10">
      <hr style="margin: 6px 0; border: 0; border-top: 1px solid #ccc;">
      <button id="toggleNight">🌙 Night Mode</button>
      <button id="toggleSat">🛰️ Satellite View</button>
      <button id="refreshRadar">🔄 Refresh Radar</button>
      <button id="zoomRunner">🏃 Zoom to Runner</button>
      <button id="zoomCourse">🗺️ Zoom to Course</button>
    </div>
  </div>

  <div id="elevationContainer">
    <canvas id="elevationChart"></canvas>
  </div>

  <div id="tableContainer">
    <table class="pacingTable">
      <thead>
        <tr>
          <th>Aid Station</th>
          <th>Mile</th>
          <th>Plan ETA (30h)</th>
          <th>Live Projected ETA</th>
          <th>Leg Mi</th>
          <th>Gain/Loss</th>
          <th>Logistics & Gear Notes</th>
        </tr>
      </thead>
      <tbody id="aidTableBody">
        <!-- Dynamically Populated -->
      </tbody>
    </table>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiZmluczEyOSIsImEiOiJjbWRkYTAxcXIwMmdvMnJwc2xodjF4b3M5In0.58QcMA8Zo_BPNLORLz5Sug';
    const GARMIN_FEED = "https://share.garmin.com/Feed/Share/DanFindley";
    
    const RACE_START_TIME = new Date('2026-08-08T05:00:00-06:00');

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/outdoors-v12',
      center: [-109.25, 38.50],
      zoom: 10
    });
    map.addControl(new mapboxgl.NavigationControl());

    // State toggles
    let isNightMode = false;
    let isSatellite = false;

    function createCustomMarker(emoji, color = 'black', withBg = false, fontSize = '20px', bgSize = '32px') {
      const el = document.createElement('div');
      el.style.fontSize = fontSize;
      el.style.color = color;
      el.style.textAlign = 'center';
      el.textContent = emoji;
      if (withBg) {
        el.style.background = 'white';
        el.style.borderRadius = '50%';
        el.style.width = bgSize;
        el.style.height = bgSize;
        el.style.display = 'flex';
        el.style.justifyContent = 'center';
        el.style.alignItems = 'center';
        el.style.boxShadow = '0 0 5px rgba(0,0,0,0.5)';
      }
      return el;
    }

    const aidStations = [
      { name: "Start", targetMile: 0.0, legMi: 0, gain: "+0", loss: "-0", planEta: "Aug 8, 5:00 AM", coords: null, notes: "Start w/ Headlamp & Gloves" },
      { name: "Upper Porcupine 1", targetMile: 6.5, legMi: 6.5, gain: "+516", loss: "-1094", planEta: "Aug 8, 6:16 AM", coords: [-109.3586286099904, 38.578562602650415], notes: "<span class='badge badge-crew'>Crew</span> Drop Headlamp & Gloves" },
      { name: "Upper Porcupine 2", targetMile: 15.4, legMi: 8.9, gain: "+1500", loss: "-1556", planEta: "Aug 8, 8:10 AM", coords: [-109.3586286099904, 38.578562602650415], notes: "<span class='badge badge-crew'>Crew</span> Warming Up - Hydrate" },
      { name: "Hazardous 1", targetMile: 23.2, legMi: 7.8, gain: "+2294", loss: "-241", planEta: "Aug 8, 10:44 AM", coords: [-109.2815, 38.5255], notes: "<span class='badge badge-drop'>Drop Bag</span> Peak Heat Climb" },
      { name: "Geyser 1", targetMile: 32.0, legMi: 8.8, gain: "+3293", loss: "-2109", planEta: "Aug 8, 1:58 PM", coords: [-109.22586, 38.47884], notes: "<span class='badge badge-drop'>Drop Bag</span> Afternoon Push" },
      { name: "Dark Canyon", targetMile: 42.2, legMi: 10.2, gain: "+506", loss: "-1824", planEta: "Aug 8, 4:01 PM", coords: [-109.17981, 38.41583], notes: "<span class='badge badge-crew'>Crew</span> Cruising Descent" },
      { name: "Winter Creek", targetMile: 47.7, legMi: 5.5, gain: "+36", loss: "-1510", planEta: "Aug 8, 5:06 PM", coords: [-109.18627, 38.36465], notes: "<span class='badge badge-crew'>Crew</span> Grab Headlamp just in case" },
      { name: "South Mountain 1", targetMile: 56.8, legMi: 9.1, gain: "+2515", loss: "-54", planEta: "Aug 8, 7:54 PM", coords: [-109.251646, 38.418903], notes: "<span class='badge badge-crew'>Crew</span> <span class='badge badge-drop'>Drop Bag</span> <span class='badge badge-gear'>Jacket/Gloves</span>" },
      { name: "South Mountain 2", targetMile: 67.7, legMi: 10.9, gain: "+2787", loss: "-2980", planEta: "Aug 8, 11:48 PM", coords: [-109.251646, 38.418903], notes: "<span class='badge badge-crew'>Crew</span> <span class='badge badge-drop'>Drop Bag</span> Night Loop Complete" },
      { name: "Squaw Springs", targetMile: 75.4, legMi: 7.7, gain: "+928", loss: "-1964", planEta: "Aug 9, 2:33 AM", coords: [-109.2898, 38.47916], notes: "<span class='badge badge-crew'>Crew</span> Pre-Dawn Cold" },
      { name: "Geyser 2", targetMile: 81.0, legMi: 5.6, gain: "+1648", loss: "-179", planEta: "Aug 9, 4:42 AM", coords: [-109.22586, 38.47884], notes: "<span class='badge badge-drop'>Drop Bag</span> Sun Opening Up" },
      { name: "Hazardous 2", targetMile: 88.0, legMi: 7.0, gain: "+848", loss: "-1966", planEta: "Aug 9, 7:00 AM", coords: [-109.2815, 38.5255], notes: "<span class='badge badge-drop'>Drop Bag</span> Drop Headlamp & Heavy Layers" },
      { name: "Finish", targetMile: 99.2, legMi: 11.2, gain: "+2897", loss: "-4339", planEta: "Aug 9, 11:00 AM", coords: null, notes: "Final 11.2 Mi Push to Buckle!" }
    ];

    let elevationChart;
    let elevationData = [];
    let elevationLabels = [];
    let coursePoints = [];
    let totalMiles = 0;
    let totalClimb = 0;
    const liveMarker = new mapboxgl.Marker({ element: createCustomMarker('🏃‍♂️', 'black', true, '24px', '38px') });
    let courseBounds;
    let lastUpdateData = { mile: 0, time: null };
    let radarStrength = 10;
    const maxRadarLayers = 20;

    map.on('load', () => {
      initCourse();
      setupRadarControls();
      setupZoomControls();
      fetchGarminLocation();
      setInterval(fetchGarminLocation, 120000); 
    });

    // Handle Map Style Changes (Satellite / Dark Mode)
    map.on('style.load', () => {
      addCourseToMap();
      preloadRadarLayers();
      updateRadarVisibility(document.getElementById('toggleRadar').checked);
    });

    async function fetchGarminLocation() {
      const CORS_PROXY = "https://corsproxy.io/?";
      try {
        const response = await fetch(`${CORS_PROXY}${GARMIN_FEED}`);
        if (!response.ok) throw new Error(`HTTP status: ${response.status}`);
        const kmlText = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(kmlText, "application/xml");
        const coordElement = xmlDoc.querySelector("coordinates");
        if (!coordElement) throw new Error("No coordinates found");

        const [lng, lat] = coordElement.textContent.trim().split(",").map(Number);
        liveMarker.setLngLat([lng, lat]).addTo(map);
        updateElevationMarker(lng, lat, new Date());
      } catch (error) {
        console.error("Garmin KML fetch error:", error);
      }
    }

    async function initCourse() {
      const data = await fetch('course.geojson').then(res => res.json());
      window.courseDataGeoJson = data; // Save for style switching

      const coords = data.features[0].geometry.coordinates;
      let totalDist = 0;
      let climb = 0;
      const bounds = new mapboxgl.LngLatBounds();

      for (let i = 0; i < coords.length; i++) {
        bounds.extend(coords[i]);
        if (i > 0) {
          totalDist += distance(coords[i - 1], coords[i]);
          const elevGain = (coords[i][2] - coords[i - 1][2]) * 3.28084;
          if (elevGain > 0) climb += elevGain;
        }
        
        const currentMile = totalDist / 1609.34;
        
        aidStations.forEach(station => {
            if (!station.coords && currentMile >= station.targetMile) {
                station.coords = [coords[i][0], coords[i][1]];
            }
        });

        elevationLabels.push(Number(currentMile.toFixed(1)));
        const elevFeet = coords[i][2] ? coords[i][2] * 3.28084 : 0;
        elevationData.push(elevFeet);
        coursePoints.push([coords[i][0], coords[i][1]]);
      }

      totalClimb = Math.round(climb);
      totalMiles = (totalDist / 1609.34).toFixed(1);
      courseBounds = bounds;

      // SET INITIAL DEFAULT UI BEFORE GARMIN PINGS 
      document.getElementById('remain').textContent = totalMiles;
      document.getElementById('climbInfo').textContent = `Climbed: 0 ft | To Go: ${totalClimb} ft`;
      if (elevationData.length > 0) {
          document.getElementById('elev').textContent = elevationData[0].toFixed(0);
      }

      if (map.isStyleLoaded()) {
          addCourseToMap();
      }

      aidStations.forEach(station => {
        if(station.coords && station.name !== "Start" && station.name !== "Finish") {
            new mapboxgl.Marker({ element: createCustomMarker('✚', '#d32f2f', true, '18px', '30px') })
            .setLngLat(station.coords)
            .setPopup(new mapboxgl.Popup({ offset: 15 }).setText(station.name))
            .addTo(map);
        }
      });

      new mapboxgl.Marker({ element: createCustomMarker('🏳️', 'green', true, '18px', '30px') })
        .setLngLat(coursePoints[0])
        .setPopup(new mapboxgl.Popup({ offset: 15 }).setText("Start"))
        .addTo(map);

      new mapboxgl.Marker({ element: createCustomMarker('🏁', 'black', true, '18px', '30px') })
        .setLngLat(coursePoints[coursePoints.length - 1])
        .setPopup(new mapboxgl.Popup({ offset: 15 }).setText("Finish"))
        .addTo(map);

      map.fitBounds(courseBounds, { padding: 40 });
      buildPacingTable(0, 18.15, false);

      const ctx = document.getElementById('elevationChart').getContext('2d');
      elevationChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: elevationLabels,
          datasets: [{
            label: 'Elevation (ft)',
            data: elevationData,
            borderColor: '#1E3F66',
            fill: false,
            pointRadius: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: 'Distance (mi)' }, ticks: { callback: function(val) { return this.getLabelForValue(val).toFixed(1); } } },
            y: { title: { display: true, text: 'Elev (ft)' } }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    function addCourseToMap() {
      if (!window.courseDataGeoJson || !map.isStyleLoaded()) return;
      if (!map.getSource('course')) {
        map.addSource('course', { type: 'geojson', data: window.courseDataGeoJson });
        map.addLayer({
          id: 'course-line',
          type: 'line',
          source: 'course',
          paint: { 'line-color': '#FF4500', 'line-width': 4, 'line-blur': 1 }
        });
      }
    }

    function buildPacingTable(currentMile, avgPace, isRaceActive) {
      const tbody = document.getElementById('aidTableBody');
      tbody.innerHTML = '';

      aidStations.forEach((st, idx) => {
        const row = document.createElement('tr');
        
        let statusClass = '';
        if (currentMile >= st.targetMile && st.targetMile > 0) {
          statusClass = 'status-passed';
        } else if (currentMile < st.targetMile && (idx === 0 || currentMile >= aidStations[idx-1].targetMile)) {
          statusClass = 'status-next';
        }

        let liveEtaStr = "--";
        if (st.targetMile === 0) {
          liveEtaStr = st.planEta;
        } else if (currentMile >= st.targetMile && st.targetMile > 0) {
          liveEtaStr = "Passed"; 
        } else if (isRaceActive) {
          const totalLegMins = st.targetMile * avgPace;
          const projDate = new Date(RACE_START_TIME.getTime() + totalLegMins * 60000);
          
          let ampm = projDate.getHours() >= 12 ? 'PM' : 'AM';
          let hrs = projDate.getHours() % 12 || 12;
          let mins = projDate.getMinutes().toString().padStart(2, '0');
          let day = projDate.getDate();
          
          liveEtaStr = `Aug ${day}, ${hrs}:${mins} ${ampm}`;
        } else {
          liveEtaStr = st.planEta; 
        }

        row.className = statusClass;
        row.innerHTML = `
          <td><strong>${st.name}</strong></td>
          <td>${st.targetMile}</td>
          <td>${st.planEta}</td>
          <td><strong>${liveEtaStr}</strong></td>
          <td>${st.legMi} mi</td>
          <td>${st.gain} / ${st.loss}</td>
          <td>${st.notes}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function updateElevationMarker(lng, lat, timestamp) {
      let closestIndex = 0;
      let minDist = Infinity;
      for (let i = 0; i < coursePoints.length; i++) {
        const d = distance([lng, lat], coursePoints[i]);
        if (d < minDist) { minDist = d; closestIndex = i; }
      }

      let traveledDist = 0;
      let climbed = 0;
      for (let i = 1; i <= closestIndex; i++) {
        traveledDist += distance(coursePoints[i - 1], coursePoints[i]);
        const gain = elevationData[i] - elevationData[i - 1];
        if (gain > 0) climbed += gain;
      }

      const currentMile = (traveledDist / 1609.34);
      const remainMiles = (totalMiles - currentMile).toFixed(1);
      const currentElev = elevationData[closestIndex].toFixed(0);
      const climbedFt = Math.round(climbed);
      const climbRemaining = Math.max(0, totalClimb - climbedFt);

      document.getElementById('mile').textContent = currentMile.toFixed(1);
      document.getElementById('elev').textContent = currentElev;
      document.getElementById('remain').textContent = remainMiles;
      document.getElementById('climbInfo').textContent = `Climbed: ${climbedFt} ft | To Go: ${climbRemaining} ft`;

      const elapsedMinutes = (timestamp - RACE_START_TIME) / 60000;
      let avgPace = 18.15; 

      if (elapsedMinutes > 0 && currentMile > 0.1) {
        avgPace = elapsedMinutes / currentMile;
        const avgMin = Math.floor(avgPace);
        const avgSec = Math.floor((avgPace - avgMin) * 60);
        document.getElementById('averagePace').textContent = `Overall Pace: ${avgMin}:${avgSec.toString().padStart(2, '0')} min/mi`;

        const estFinishMinutes = avgPace * totalMiles;
        const finishTime = new Date(RACE_START_TIME.getTime() + estFinishMinutes * 60000);
        
        let ampm = finishTime.getHours() >= 12 ? 'PM' : 'AM';
        let hrs = finishTime.getHours() % 12 || 12;
        let mins = finishTime.getMinutes().toString().padStart(2, '0');
        document.getElementById('estFinish').textContent = `Est Finish: ${hrs}:${mins} ${ampm}`;
        
        const targetMinsAtDist = currentMile * 18.15;
        const deltaMins = Math.round(elapsedMinutes - targetMinsAtDist);
        const deltaStr = deltaMins <= 0 ? `${Math.abs(deltaMins)} mins AHEAD` : `${deltaMins} mins BEHIND`;
        document.getElementById('deltaTarget').textContent = `Vs 30-Hr Plan: ${deltaStr}`;
      } else {
        document.getElementById('averagePace').textContent = `Overall Pace: Pre-Race`;
        document.getElementById('estFinish').textContent = `Est Finish: --`;
        document.getElementById('deltaTarget').textContent = `Vs 30-Hr Plan: --`;
      }

      buildPacingTable(currentMile, avgPace, elapsedMinutes > 0);

      lastUpdateData = { mile: currentMile, time: timestamp };
      document.getElementById('lastUpdate').textContent = "Location: " + timestamp.toLocaleTimeString();

      elevationChart.data.datasets[1] = {
        label: 'Current Position',
        data: elevationData.map((val, idx) => idx === closestIndex ? val : null),
        borderColor: 'red',
        backgroundColor: 'red',
        pointRadius: 6,
        showLine: false
      };
      elevationChart.update();
    }

    function distance(a, b) {
      const R = 6371000;
      const toRad = x => x * Math.PI / 180;
      const dLat = toRad(b[1] - a[1]);
      const dLon = toRad(b[0] - a[0]);
      const lat1 = toRad(a[1]);
      const lat2 = toRad(b[1]);
      const x = dLon * Math.cos((lat1 + lat2) / 2);
      const y = dLat;
      return Math.sqrt(x * x + y * y) * R;
    }

    function preloadRadarLayers() {
      if (!map.isStyleLoaded()) return;
      for (let i = 0; i < maxRadarLayers; i++) {
        const layerId = `radar-layer-${i}`;
        if (!map.getSource(layerId)) {
          map.addSource(layerId, {
            type: 'raster',
            tiles: [`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${OWM_API_KEY}`],
            tileSize: 256
          });
          map.addLayer({
            id: layerId,
            type: 'raster',
            source: layerId,
            paint: { 'raster-opacity': 1.0 },
            layout: { visibility: i < radarStrength ? 'visible' : 'none' }
          });
        }
      }
    }

    function updateRadarVisibility(isVisible = true) {
      for (let i = 0; i < maxRadarLayers; i++) {
        const visibility = (isVisible && i < radarStrength) ? 'visible' : 'none';
        if (map.getLayer(`radar-layer-${i}`)) {
          map.setLayoutProperty(`radar-layer-${i}`, 'visibility', visibility);
        }
      }
    }

    function applyMapStyle() {
      if (isSatellite) {
        map.setStyle('mapbox://styles/mapbox/satellite-streets-v12');
      } else if (isNightMode) {
        map.setStyle('mapbox://styles/mapbox/dark-v11');
      } else {
        map.setStyle('mapbox://styles/mapbox/outdoors-v12');
      }
    }

    function setupRadarControls() {
      const radarToggle = document.getElementById('toggleRadar');
      radarToggle.checked = true;
      radarToggle.addEventListener('change', e => updateRadarVisibility(e.target.checked));

      document.getElementById('refreshRadar').addEventListener('click', () => {
        for (let i = 0; i < maxRadarLayers; i++) {
          if (map.getLayer(`radar-layer-${i}`)) {
            map.removeLayer(`radar-layer-${i}`);
            map.removeSource(`radar-layer-${i}`);
          }
        }
        preloadRadarLayers();
        if (!radarToggle.checked) updateRadarVisibility(false);
      });

      document.getElementById('radarStrength').addEventListener('input', e => {
        radarStrength = parseInt(e.target.value, 10);
        updateRadarVisibility(radarToggle.checked);
      });

      // Night Mode Toggle
      document.getElementById('toggleNight').addEventListener('click', () => {
        isNightMode = !isNightMode;
        document.body.classList.toggle('dark-mode', isNightMode);
        document.getElementById('toggleNight').innerHTML = isNightMode ? '☀️ Day Mode' : '🌙 Night Mode';
        applyMapStyle();
        
        // Update chart text colors
        if (elevationChart) {
          elevationChart.options.scales.x.ticks.color = isNightMode ? '#ccc' : '#666';
          elevationChart.options.scales.y.ticks.color = isNightMode ? '#ccc' : '#666';
          elevationChart.update();
        }
      });

      // Satellite Toggle
      document.getElementById('toggleSat').addEventListener('click', () => {
        isSatellite = !isSatellite;
        document.getElementById('toggleSat').innerHTML = isSatellite ? '🗺️ Map View' : '🛰️ Satellite View';
        applyMapStyle();
      });
    }

    function setupZoomControls() {
      document.getElementById('zoomRunner').addEventListener('click', () => {
        const runnerPos = liveMarker.getLngLat();
        map.flyTo({ center: runnerPos, zoom: 14 });
      });
      document.getElementById('zoomCourse').addEventListener('click', () => {
        if (courseBounds) map.fitBounds(courseBounds, { padding: 40 });
      });
    }
  </script>
</body>
</html>
